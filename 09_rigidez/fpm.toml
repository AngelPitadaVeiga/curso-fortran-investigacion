# Paquete fpm del bloque 09.  Uso:  fpm run rigidez   o   fpm run convergencia -- tableros/radau_iia3.txt
# fpm compila la biblioteca (src/) y el programa principal (app/) y
# resuelve solo el orden de compilación de los módulos.
name = "rigidez"
version = "1.0.0"
license = "MIT"
author = "Ángel Pita da Veiga Ramonde"
description = "Curso de Fortran - bloque 09: rigidez y Runge-Kutta implicitos"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"

[[executable]]
name = "rigidez"
source-dir = "app"
main = "principal.f90"

[[executable]]
name = "convergencia"
source-dir = "app"
main = "convergencia.f90"
