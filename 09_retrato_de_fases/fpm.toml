# Paquete fpm de la unidad 09.  Uso:  fpm run   (o  fpm run -- otro.nml)
# fpm compila la biblioteca (src/) y el programa principal (app/) y
# resuelve solo el orden de compilación de los módulos.
name = "retrato_fases"
version = "1.0.0"
license = "MIT"
author = "Ángel Pita da Veiga Ramonde"
description = "Curso de Fortran - unidad 09: retrato de fases de Van der Pol"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"

[[executable]]
name = "retrato"
source-dir = "app"
main = "principal.f90"
