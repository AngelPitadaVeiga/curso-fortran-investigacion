# Paquete fpm del bloque 06.  Uso:  fpm run   (o  fpm run -- otro.nml)
# fpm compila la biblioteca (src/) y el programa principal (app/) y
# resuelve solo el orden de compilación de los módulos.
name = "euler_modulos"
version = "1.0.0"
license = "MIT"
author = "Ángel Pita da Veiga Ramonde"
description = "Curso de Fortran - bloque 06: modulos, namelist y make (Euler para Van der Pol)"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"

[[executable]]
name = "euler"
source-dir = "app"
main = "principal.f90"
