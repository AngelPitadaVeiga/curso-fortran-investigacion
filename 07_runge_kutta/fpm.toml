# Paquete fpm del bloque 07.  Uso:  fpm run rk   o   fpm run orden -- tableros/rk4.txt
# fpm compila la biblioteca (src/) y el programa principal (app/) y
# resuelve solo el orden de compilación de los módulos.
name = "runge_kutta"
version = "1.0.0"
license = "MIT"
author = "Ángel Pita da Veiga Ramonde"
description = "Curso de Fortran - bloque 07: Runge-Kutta explicitos con tableros de Butcher"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[library]
source-dir = "src"

[[executable]]
name = "rk"
source-dir = "app"
main = "principal.f90"

[[executable]]
name = "orden"
source-dir = "app"
main = "convergencia.f90"
